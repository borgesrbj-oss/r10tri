<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1A8A7D">
    <title>Sem conexão | Gotri</title>
    <link rel="icon" href="/favicon.svg">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #0a0a0a; color: #f5f5f5; font: 16px/1.6 system-ui, sans-serif; }
      main { width: 100%; max-width: 440px; padding: 28px; border: 1px solid #303030; border-radius: 16px; background: #191919; }
      img { display: block; margin-bottom: 20px; border-radius: 18px; }
      h1 { font-size: 1.65rem; line-height: 1.25; }
      p { color: #c7c7c7; }
      a { display: inline-flex; min-height: 44px; align-items: center; padding: 10px 18px; margin-top: 12px; border-radius: 9px; background: #1a8a7d; color: #fff; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #b5f1e8; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" width="72" height="72" alt="Gotri">
      <h1>Vamos retomar quando a conexão voltar.</h1>
      <p>Esta tela não mostra dados de atletas. Para consultar ou registrar seus treinos, conecte-se à internet novamente.</p>
      <p>Se você estava preenchendo um formulário em outra aba, mantenha essa aba aberta e reconecte antes de salvar.</p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
